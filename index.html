<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f6b3a">
<title>麻雀大会 スコア計算</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="app-header">
    <div class="title-wrap">
      <span class="logo">🀄</span>
      <h1 id="app-title">麻雀大会 スコア計算</h1>
    </div>
    <div class="header-meta" id="header-meta"></div>
  </header>

  <nav class="tabs" id="tabs">
    <button class="tab is-active" data-view="match">対局</button>
    <button class="tab" data-view="standings">総合順位</button>
    <button class="tab" data-view="players">プレイヤー</button>
    <button class="tab" data-view="settings">設定</button>
  </nav>

  <main>
    <section id="view-match" class="view is-active"></section>
    <section id="view-standings" class="view"></section>
    <section id="view-players" class="view"></section>
    <section id="view-settings" class="view"></section>
  </main>

  <div id="toast" class="toast" hidden></div>

  <script src="app.js"></script>
</body>
</html>
